<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Models for Working with LLMs</title>
  <link rel="stylesheet" href="vendor/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="vendor/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="theme/talk.css">
</head>
<body>
  <div class="reveal">
    <div class="slides" id="slides"></div>
  </div>

  <script src="vendor/reveal.js/dist/reveal.js"></script>
  <script src="vendor/reveal.js/plugin/markdown/markdown.js"></script>
  <script src="vendor/reveal.js/plugin/notes/notes.js"></script>
  <script src="manifest.js"></script>
  <script>
    // Inline the artwork parts library so slides can <use href="#part-id">. See README § Artwork.
    fetch('art/parts.svg')
      .then((r) => r.text())
      .then((svg) => document.body.insertAdjacentHTML('afterbegin', svg))
      .catch((e) => console.error('Artwork parts failed to load', e));

    // The markdown plugin scans for data-markdown sections at init, so build them first.
    const slides = document.getElementById('slides');
    for (const file of window.DECK_STATIONS) {
      const section = document.createElement('section');
      section.setAttribute('data-markdown', file);
      section.setAttribute('data-separator', '^\\r?\\n---\\r?\\n$');
      section.setAttribute('data-separator-notes', '^Note:');
      slides.appendChild(section);
    }

    // Inline SVG files into [data-svg] elements (artwork that reads theme variables and
    // fonts must live in the page, not in <img>). data-zoom="<region>" crops a map to a region.
    const svgText = {};
    function inlineSvgs() {
      for (const el of document.querySelectorAll('[data-svg]')) {
        (svgText[el.dataset.svg] ??= fetch(el.dataset.svg).then((r) => r.text()))
          .then((text) => {
            el.innerHTML = text;
            const svg = el.querySelector('svg');
            if (el.dataset.zoom) {
              // One region id, or several comma-separated ("regional,everyday") cropped to their union.
              const regions = JSON.parse(svg.dataset.regions || '{}');
              const boxes = el.dataset.zoom.split(',').map((id) => regions[id.trim()]).filter(Boolean);
              if (boxes.length) {
                const x = Math.min(...boxes.map((b) => b[0])), y = Math.min(...boxes.map((b) => b[1]));
                const r = Math.max(...boxes.map((b) => b[0] + b[2])), btm = Math.max(...boxes.map((b) => b[1] + b[3]));
                svg.setAttribute('viewBox', [x, y, r - x, btm - y].join(' '));
              }
            }
            if (el.dataset.label) svg.setAttribute('aria-label', el.dataset.label);
          })
          .catch((e) => console.error('SVG failed to load', el.dataset.svg, e));
      }
    }

    Reveal.initialize({
      hash: true,
      width: 1920,
      height: 1080,
      margin: 0.04,
      controls: true,
      progress: true,
      transition: 'fade',
      plugins: [RevealMarkdown, RevealNotes],
    }).then(inlineSvgs);

    // Remote control client: inert unless the URL has ?remote=<token>.
    if (new URLSearchParams(location.search).has('remote')) {
      const s = document.createElement('script');
      s.src = 'remote/deck-remote.js';
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
